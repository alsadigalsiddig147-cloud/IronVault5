name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. مسح مجلد الأندرويد القديم وإنشاء واحد جديد وسليم
      - name: Recreate Standard Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name iron_vault

      # 2. ترتيب ملفات C++ ونقلها للمكان الصحيح تلقائياً
      - name: Setup C++ and Kotlin Files
        run: |
          # إنشاء مجلد cpp في المكان الصحيح
          mkdir -p android/app/src/main/cpp
          
          # إذا كان مجلد cpp موجوداً في الجذر، انقله للمكان الصحيح
          if [ -d "cpp" ]; then
            cp -r cpp/* android/app/src/main/cpp/
            rm -rf cpp
          fi
          
          # إنشاء ملف NativeCore.kt تلقائياً لضمان عدم حدوث أخطاء
          mkdir -p android/app/src/main/kotlin/com/example/ironvault
          echo 'package com.example.ironvault' > android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt
          echo 'object NativeCore {' >> android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt
          echo '    init { System.loadLibrary("iron_core") }' >> android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt
          echo '    external fun nativeEncrypt(path: String, password: String): String' >> android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt
          echo '    external fun nativeWipe(path: String): Boolean' >> android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt
          echo '}' >> android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt

      # 3. ربط CMake بـ Gradle تلقائياً
      - name: Link CMake to Gradle
        run: |
          if ! grep -q "externalNativeBuild" android/app/build.gradle; then
            sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }' android/app/build.gradle
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Standalone Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-flutter-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
