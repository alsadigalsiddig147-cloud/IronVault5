name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. إنشاء مشروع أندرويد قياسي ونظيف
      - name: Recreate Standard Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name iron_vault

      # 2. إنشاء ملف init.gradle لإجبار جميع الإضافات على استخدام compileSdk 36
      - name: Create Gradle Init Script
        run: |
          cat << 'EOF' > android/init.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.extensions.findByName("android") != null) {
                      def android = project.extensions.getByName("android")
                      // Force all sub-projects (like file_picker) to compile against SDK 36
                      if (android.hasProperty("compileSdkVersion")) {
                          android.compileSdkVersion = 36
                      }
                  }
              }
          }
          EOF

      # 3. ترتيب ملفات C++ و Kotlin
      - name: Setup C++ and Kotlin Files
        run: |
          mkdir -p android/app/src/main/cpp
          if [ -d "cpp" ]; then
            cp -r cpp/* android/app/src/main/cpp/
            rm -rf cpp
          fi
          mkdir -p android/app/src/main/kotlin/com/example/ironvault
          cat > android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt << 'EOF'
          package com.example.ironvault
          object NativeCore {
              init { System.loadLibrary("iron_core") }
              external fun nativeEncrypt(path: String, password: String): String
              external fun nativeWipe(path: String): Boolean
          }
          EOF

      # 4. ربط CMake بـ Gradle
      - name: Link CMake to Gradle
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle.kts; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path = file("src/main/cpp/CMakeLists.txt")\n        }\n    }' android/app/build.gradle.kts
            fi
          elif [ -f "android/app/build.gradle" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }' android/app/build.gradle
            fi
          fi

      - name: Get Dependencies
        run: flutter pub get

      # 5. بناء التطبيق باستخدام init.gradle لحل مشكلة الإصدارات
      - name: Build Standalone Debug APK
        run: flutter build apk --debug --init-script=android/init.gradle

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-flutter-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
