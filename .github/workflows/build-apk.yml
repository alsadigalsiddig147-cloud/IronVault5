name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.19.x'

    - name: Prepare Clean Android & Flutter Project
      run: |
        # حذف مجلد أندرويد القديم المسبب للمشاكل إن وجد
        rm -rf android
        
        # إنشاء هيكل فلوتار وأندرويد متكامل ونظيف حديث
        flutter create . --org com.ironvault --project-name iron_vault --platforms android
        
        # ضبط الحد الأدنى لإصدار SDK في ملفات Gradle ليتوافق مع الحزم المتقدمة
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Standalone Debug APK
      run: flutter build apk --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ironvault-flutter-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
