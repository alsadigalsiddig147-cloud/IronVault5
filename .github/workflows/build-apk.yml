name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Create Stable Android Environment & Build APK
      run: |
        # إنشاء هيكل أندرويد حقيقي ونظيف بدون تفاعلات
        npx react-native init IronVaultTemp --version 0.73.2 --skip-install --yes || true
        
        if [ -d "IronVaultTemp/android" ]; then
          cp -r IronVaultTemp/android ./android
        fi

        # دمج ملفات C++ الخاصة بك (CMakeLists.txt و iron_core.cpp) داخل مجلد البناء
        if [ -d "android/app" ]; then
          mkdir -p android/app/src/main/cpp
          cp -f CMakeLists.txt android/app/src/main/cpp/ 2>/dev/null || true
          cp -f iron_core.cpp android/app/src/main/cpp/ 2>/dev/null || true
          cp -f AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
        fi

        # بدء تجميع ملف الـ APK الحقيقي عبر Gradle
        if [ -d "android" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "Error: Android directory missing!"
          exit 1
        fi

    - name: Upload Real APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ironvault-apk
        path: |
          android/app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
