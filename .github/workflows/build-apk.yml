name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. إنشاء مشروع أندرويد قياسي ونظيف
      - name: Recreate Standard Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name iron_vault

      # 2. ترتيب ملفات C++ و Kotlin (نقلها للمسار الصحيح تلقائياً)
      - name: Setup C++ and Kotlin Files
        run: |
          mkdir -p android/app/src/main/cpp
          if [ -d "cpp" ]; then
            cp -r cpp/* android/app/src/main/cpp/
            rm -rf cpp
          fi
          mkdir -p android/app/src/main/kotlin/com/example/ironvault
          cat > android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt << 'EOF'
          package com.example.ironvault
          object NativeCore {
              init { System.loadLibrary("iron_core") }
              external fun nativeEncrypt(path: String, password: String): String
              external fun nativeWipe(path: String): Boolean
          }
          EOF

      # 3. إجبار جميع الإضافات على استخدام compileSdkVersion 36 (باستخدام Groovy DSL الآمن)
      - name: Force compileSdk 36 via Groovy DSL
        run: |
          # إذا كان المشروع يستخدم Kotlin DSL، نقوم بتغيير اسم الملف ليعمل كـ Groovy
          if [ -f "android/build.gradle.kts" ]; then
            mv android/build.gradle.kts android/build.gradle
          fi
          
          # إضافة الكود في بداية الملف لضمان تطبيقه قبل أي شيء آخر
          cat << 'EOF' > android/build.gradle.tmp
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.layout.buildDirectory = file('../build')
          subprojects {
              project.layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name)
          }
          
          // الإصلاح الجوهري: استخدام plugins.withId لضمان التوقيت الصحيح
          subprojects { subproject ->
              subproject.plugins.withId('com.android.library') {
                  subproject.android {
                      compileSdkVersion 36
                  }
              }
              subproject.plugins.withId('com.android.application') {
                  subproject.android {
                      compileSdkVersion 36
                  }
              }
          }
          
          tasks.register("clean", Delete) {
              delete rootProject.layout.buildDirectory
          }
          EOF
          
          # دمج الكود الجديد مع أي كود قديم موجود (مثل جميع المستودعات)
          if [ -f "android/build.gradle" ]; then
            # إزالة الكود القديم الذي قد يتعارض
            grep -v "allprojects" android/build.gradle | grep -v "rootProject.layout" | grep -v "subprojects" | grep -v "tasks.register" > android/build.gradle.old || true
            cat android/build.gradle.old >> android/build.gradle.tmp
            rm android/build.gradle.old
          fi
          
          mv android/build.gradle.tmp android/build.gradle

      # 4. ربط CMake بـ Gradle (بطريقة آمنة تدعم كلا الامتدادين)
      - name: Link CMake to Gradle
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle.kts; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path = file("src/main/cpp/CMakeLists.txt")\n        }\n    }' android/app/build.gradle.kts
            fi
          elif [ -f "android/app/build.gradle" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }' android/app/build.gradle
            fi
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Standalone Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-flutter-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
