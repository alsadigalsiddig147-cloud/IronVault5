name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. إنشاء ملفات الأندرويد الأساسية (مثل gradlew) دون المساس بملفات C++ التي أنشأناها
      - name: Create Android Project Files
        run: flutter create . --platforms=android --project-name iron_vault

      # 2. التأكد من أن Gradle مرتبط بـ CMake (في حال قام Flutter بإنشاء build.gradle جديد)
      - name: Link CMake to Gradle
        run: |
          if ! grep -q "externalNativeBuild" android/app/build.gradle; then
            sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }' android/app/build.gradle
          fi

      - name: Get Dependencies
        run: flutter pub get

      # 3. بناء التطبيق (سيقوم ببناء C++ تلقائياً بفضل إعدادات Gradle)
      - name: Build Standalone Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-flutter-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
