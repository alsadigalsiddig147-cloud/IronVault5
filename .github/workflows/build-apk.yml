name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Configure Android & Build APK
      run: |
        # توليد مجلد أندرويد عبر إعدادات إكسبو مباشرة
        npx expo prebuild --platform android --clean
        
        # التأكد من دمج ملفات C++ ومجلد المصدر في مكانها الصحيح للـ Gradle
        if [ -f "CMakeLists.txt" ] && [ -d "android/app" ]; then
          mkdir -p android/app/src/main/cpp
          cp -f CMakeLists.txt android/app/src/main/cpp/
          cp -f iron_core.cpp android/app/src/main/cpp/
        fi

        # تجميع ملف الـ APK بنجاح عبر Gradle
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ironvault-apk
        path: |
          android/app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
