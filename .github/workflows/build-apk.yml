name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. إنشاء مشروع أندرويد قياسي ونظيف
      - name: Recreate Standard Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name iron_vault

      # 2. ترتيب ملفات C++ و Kotlin
      - name: Setup C++ and Kotlin Files
        run: |
          mkdir -p android/app/src/main/cpp
          if [ -d "cpp" ]; then
            cp -r cpp/* android/app/src/main/cpp/
            rm -rf cpp
          fi
          mkdir -p android/app/src/main/kotlin/com/example/ironvault
          cat > android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt << 'EOF'
          package com.example.ironvault
          object NativeCore {
              init { System.loadLibrary("iron_core") }
              external fun nativeEncrypt(path: String, password: String): String
              external fun nativeWipe(path: String): Boolean
          }
          EOF

      # 3. تعديل ملفات Gradle بأمان باستخدام Python (لإجبار compileSdk 36)
      - name: Patch Gradle Files for compileSdk 36
        run: |
          cat << 'PYEOF' > patch_gradle.py
          import os

          # 1. تعديل ملف التطبيق الأساسي (app/build.gradle)
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f:
                  content = f.read()
              # استبدال أي إشارة إلى flutter.compileSdkVersion بالرقم 36
              content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              with open(app_gradle, 'w') as f:
                  f.write(content)
              print("Patched app/build.gradle")

          # 2. تعديل ملف المشروع الرئيسي (build.gradle) لإجبار جميع الإضافات
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r') as f:
                  content = f.read()
              
              if 'subprojects {' not in content:
                  patch = """
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion = 36
                      }
                  }
              }
          }
          """
                  # إدراج الكود في نهاية الملف
                  content += "\n" + patch
                  with open(root_gradle, 'w') as f:
                      f.write(content)
                  print("Patched root build.gradle")
              else:
                  print("Root build.gradle already patched")
          PYEOF
          python3 patch_gradle.py

      # 4. ربط CMake بـ Gradle
      - name: Link CMake to Gradle
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle.kts; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path = file("src/main/cpp/CMakeLists.txt")\n        }\n    }' android/app/build.gradle.kts
            fi
          elif [ -f "android/app/build.gradle" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }' android/app/build.gradle
            fi
          fi

      - name: Get Dependencies
        run: flutter pub get

      # 5. بناء التطبيق
      - name: Build Standalone Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-flutter-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
