name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.19.x'

    - name: Create Clean Flutter Project Structure
      run: |
        # إنشاء مشروع فلوتار مؤقت لتوليد ملفات أندرويد القياسية
        flutter create temp_app --org com.ironvault --project-name iron_vault --platforms android
        
        # نقل ملفات أندرويد المتكاملة إلى جذر مشروعنا الحالي
        cp -r temp_app/android ./
        
        # نسخ ملف الواجهة الرئيسي الذي أنشأناه
        mkdir -p lib
        # (إذا كان ملف main.dart موجوداً مسبقاً في lib سيتم الاحتفاظ به)

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Standalone Debug APK
      run: flutter build apk --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ironvault-flutter-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
