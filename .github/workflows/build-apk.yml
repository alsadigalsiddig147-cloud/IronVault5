name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.19.x'

    - name: Initialize Project and Fix Dependencies
      run: |
        # إذا لم يكن pubspec.yaml موجوداً في الجذر، نقوم بإنشائه تلقائياً لمنع أي نقص
        if [ ! -f "pubspec.yaml" ]; then
          cat << 'EOF' > pubspec.yaml
        name: iron_vault
        description: "Iron Vault Hybrid - C++ Engine with Flutter"
        publish_to: 'none'
        version: 1.0.0+1

        environment:
          sdk: '>=3.0.0 <4.0.0'

        dependencies:
          flutter:
            sdk: flutter
          ffi: ^2.1.0
          path_provider: ^2.1.1
          file_picker: ^8.0.0

        dev_dependencies:
          flutter_test:
            sdk: flutter
          flutter_lints: ^3.0.0

        flutter:
          uses-material-design: true
        EOF
        fi

        # إنشاء هيكل أندرويد ودعم المنصة بشكل نظيف
        flutter create . --org com.ironvault --project-name iron_vault --platforms android
        
        # ضبط الحد الأدنى للإصدار ليتوافق مع الحزم الحديثة
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Standalone Debug APK
      run: flutter build apk --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ironvault-flutter-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
