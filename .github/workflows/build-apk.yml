name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. إنشاء مشروع Flutter قياسي في مجلد مؤقت (هذا يحل مشكلة Gradle)
      - name: Create Standard Flutter Project
        run: flutter create .temp_flutter_project

      # 2. نسخ ملفات Android القياسية (Gradle, etc.) إلى مشروعك
      - name: Copy Standard Android Files
        run: |
          rm -rf android
          cp -r .temp_flutter_project/android .
          # استعادة ملفات C++ التي أنشأناها
          mkdir -p android/app/src/main/cpp
          # (ملاحظة: الملفات التي رفعتها على GitHub موجودة بالفعل في مستودعك)
          # لكننا تأكدنا من وجود المجلد

      # 3. ربط CMake بـ Gradle تلقائياً
      - name: Link CMake to Gradle
        run: |
          if ! grep -q "externalNativeBuild" android/app/build.gradle; then
            sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }' android/app/build.gradle
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Standalone Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-flutter-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
