name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Standard Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name iron_vault --org com.example
          find android -type f \( -name "*.xml" -o -name "*.gradle" -o -name "*.kts" \) -exec sed -i 's/com\.example\.iron_vault/com.example.ironvault/g' {} +
          rm -rf android/app/src/main/kotlin/com/example/iron_vault

      - name: Patch AndroidManifest for Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST

      - name: Generate C++ and CMake Files
        run: |
          mkdir -p android/app/src/main/cpp
          cat > android/app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("iron_core")
          add_library(iron_core SHARED iron_core.cpp)
          find_library(log-lib log)
          target_link_libraries(iron_core ${log-lib})
          EOF
          
          cat > android/app/src/main/cpp/iron_core.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <fstream>
          #include <android/log.h>
          #include <algorithm>
          #include <random>

          #define LOG_TAG "IronVaultCore"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          extern "C" {
              JNIEXPORT jboolean JNICALL
              Java_com_example_ironvault_NativeCore_nativeWipe(JNIEnv *env, jobject thiz, jstring path) {
                  const char *nativePath = env->GetStringUTFChars(path, 0);
                  LOGI("Executing DoD 5220.22-M (7-Pass) Secure Wipe: %s", nativePath);
                  
                  std::fstream file(nativePath, std::ios::binary | std::ios::in | std::ios::out);
                  if (file.is_open()) {
                      file.seekg(0, std::ios::end);
                      std::streamsize fileSize = file.tellg();
                      file.seekg(0, std::ios::beg);

                      const std::streamsize CHUNK_SIZE = 64 * 1024; 
                      std::vector<char> buffer(CHUNK_SIZE);

                      for (int pass = 0; pass < 7; ++pass) {
                          if (pass == 0) std::fill(buffer.begin(), buffer.end(), 0x00);
                          else if (pass == 1) std::fill(buffer.begin(), buffer.end(), 0xFF);
                          else if (pass == 2) std::fill(buffer.begin(), buffer.end(), 0x55);
                          else if (pass == 3) std::fill(buffer.begin(), buffer.end(), 0xAA);
                          else {
                              std::random_device rd;
                              std::mt19937 gen(rd());
                              std::uniform_int_distribution<> dis(0, 255);
                              for (auto &c : buffer) c = static_cast<char>(dis(gen));
                          }
                          
                          file.seekp(0, std::ios::beg);
                          std::streamsize remaining = fileSize;
                          
                          while (remaining > 0) {
                              std::streamsize to_write = std::min(CHUNK_SIZE, remaining);
                              file.write(buffer.data(), to_write);
                              remaining -= to_write;
                          }
                          file.flush();
                      }
                      file.close();
                      std::remove(nativePath);
                  }
                  env->ReleaseStringUTFChars(path, nativePath);
                  return JNI_TRUE;
              }
          }
          EOF

      - name: Generate Kotlin Files
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/ironvault
          
          cat > android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt << 'EOF'
          package com.example.ironvault
          object NativeCore {
              init { System.loadLibrary("iron_core") }
              external fun nativeWipe(path: String): Boolean
          }
          EOF

          cat > android/app/src/main/kotlin/com/example/ironvault/MainActivity.kt << 'EOF'
          package com.example.ironvault
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.ironvault.app/native"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler {
                      call, result ->
                      if (call.method == "nativeWipe") {
                          val path = call.argument<String>("path")
                          if (path != null) {
                              result.success(NativeCore.nativeWipe(path))
                          } else {
                              result.error("UNAVAILABLE", "Path not found", null)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF

      # الحل: إجبار جميع الإضافات على استخدام SDK 37
      - name: Patch Gradle and Link CMake
        run: |
          APP_GRADLE=""
          if [ -f "android/app/build.gradle.kts" ]; then APP_GRADLE="android/app/build.gradle.kts"; 
          elif [ -f "android/app/build.gradle" ]; then APP_GRADLE="android/app/build.gradle"; fi

          if [ -n "$APP_GRADLE" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/g' "$APP_GRADLE"
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 37/g' "$APP_GRADLE"
            sed -i 's/compileSdk = 36/compileSdk = 37/g' "$APP_GRADLE"
            sed -i 's/compileSdkVersion 36/compileSdkVersion 37/g' "$APP_GRADLE"
            
            if ! grep -q "externalNativeBuild" "$APP_GRADLE"; then
              if [[ "$APP_GRADLE" == *.kts ]]; then
                sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path = file("src/main/cpp/CMakeLists.txt")\n        }\n    }' "$APP_GRADLE"
              else
                sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }' "$APP_GRADLE"
              fi
            fi
          fi

          ROOT_GRADLE="android/build.gradle"
          if [ -f "$ROOT_GRADLE" ]; then
            if ! grep -q "subprojects {" "$ROOT_GRADLE"; then
              cat << 'EOF' >> "$ROOT_GRADLE"

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion = 37
                      }
                  }
              }
          }
          EOF
            fi
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
