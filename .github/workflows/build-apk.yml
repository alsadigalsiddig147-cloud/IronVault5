name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. إنشاء مشروع أندرويد قياسي ونظيف
      - name: Recreate Standard Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name iron_vault

      # 2. إنشاء ملفات C++ و Kotlin مباشرة لضمان عدم ضياعها
      - name: Generate C++ and Kotlin Files
        run: |
          mkdir -p android/app/src/main/cpp
          
          cat > android/app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.4.1)
          project("iron_core")
          add_library(iron_core SHARED iron_core.cpp)
          find_library(log-lib log)
          target_link_libraries(iron_core ${log-lib})
          EOF
          
          cat > android/app/src/main/cpp/iron_core.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <fstream>
          #include <android/log.h>

          #define LOG_TAG "IronVaultCore"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          extern "C" {
          JNIEXPORT jboolean JNICALL
          Java_com_example_ironvault_NativeCore_nativeWipe(JNIEnv *env, jobject thiz, jstring path) {
              const char *nativePath = env->GetStringUTFChars(path, 0);
              LOGI("Executing DoD 5220.22-M Secure Wipe: %s", nativePath);
              std::ofstream file(nativePath, std::ios::binary | std::ios::in | std::ios::out);
              if (file.is_open()) {
                  file.seekp(0, std::ios::end);
                  size_t size = file.tellp();
                  file.seekp(0, std::ios::beg);
                  for (int pass = 0; pass < 3; ++pass) {
                      std::vector<char> buffer(size, pass == 0 ? 0x00 : (pass == 1 ? 0xFF : 0x55));
                      file.write(buffer.data(), size);
                      file.flush();
                      file.seekp(0, std::ios::beg);
                  }
                  file.close();
                  std::remove(nativePath);
              }
              env->ReleaseStringUTFChars(path, nativePath);
              return JNI_TRUE;
          }
          }
          EOF

          mkdir -p android/app/src/main/kotlin/com/example/ironvault
          cat > android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt << 'EOF'
          package com.example.ironvault
          object NativeCore {
              init { System.loadLibrary("iron_core") }
              external fun nativeWipe(path: String): Boolean
          }
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Link CMake to Gradle
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle.kts; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path = file("src/main/cpp/CMakeLists.txt")\n        }\n    }' android/app/build.gradle.kts
            fi
          elif [ -f "android/app/build.gradle" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }' android/app/build.gradle
            fi
          fi

      - name: Build Standalone Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-flutter-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
