name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. إنشاء مشروع أندرويد قياسي
      - name: Recreate Standard Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name iron_vault

      # 2. إجبار جميع الإضافات على استخدام compileSdkVersion 36 (مع تصحيح بناء جملة Kotlin DSL)
      - name: Force compileSdkVersion 36 for all subprojects
        run: |
          # إضافة سطر الاستيراد في أعلى الملف
          sed -i '1i import com.android.build.gradle.BaseExtension' android/build.gradle.kts
          
          # إضافة كود إجبار الإصدار في نهاية الملف
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.application") || plugins.hasPlugin("com.android.library")) {
                      extensions.findByType<com.android.build.gradle.BaseExtension>()?.apply {
                          compileSdkVersion(36)
                      }
                  }
              }
          }
          EOF

      # 3. ترتيب ملفات C++ و Kotlin
      - name: Setup C++ and Kotlin Files
        run: |
          mkdir -p android/app/src/main/cpp
          if [ -d "cpp" ]; then
            cp -r cpp/* android/app/src/main/cpp/
            rm -rf cpp
          fi
          mkdir -p android/app/src/main/kotlin/com/example/ironvault
          echo 'package com.example.ironvault' > android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt
          echo 'object NativeCore {' >> android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt
          echo '    init { System.loadLibrary("iron_core") }' >> android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt
          echo '    external fun nativeEncrypt(path: String, password: String): String' >> android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt
          echo '    external fun nativeWipe(path: String): Boolean' >> android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt
          echo '}' >> android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt

      # 4. ربط CMake بـ Gradle
      - name: Link CMake to Gradle
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle.kts; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path = file("src/main/cpp/CMakeLists.txt")\n        }\n    }' android/app/build.gradle.kts
            fi
          elif [ -f "android/app/build.gradle" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }' android/app/build.gradle
            fi
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Standalone Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-flutter-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
