name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android NDK (Required for C++ CMake compilation)
      uses: npxbr/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Install Dependencies
      run: |
        npm install

    - name: Generate Android Native Project & Link C++ Core
      run: |
        # توليد هيكل أندرويد حقيقي من إعدادات Expo
        npx expo prebuild --platform android --clean || npx react-native eject || true
        
        # التأكد من دمج ملفات C++ و Manifest الخاصة بك داخل المشروع
        if [ -d "android/app/src/main" ]; then
          mkdir -p android/app/src/main/cpp
          cp CMakeLists.txt android/app/src/main/cpp/ 2>/dev/null || true
          cp iron_core.cpp android/app/src/main/cpp/ 2>/dev/null || true
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
        fi

    - name: Build Debug APK via Gradle
      run: |
        if [ -d "android" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "Android directory creation failed."
          exit 1
        fi

    - name: Upload Valid APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ironvault-apk
        path: |
          android/app/build/outputs/apk/debug/*.apk
