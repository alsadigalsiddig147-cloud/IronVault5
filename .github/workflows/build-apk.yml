name: Build Flutter & C++ Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. إنشاء مشروع أندرويد قياسي ونظيف
      - name: Recreate Standard Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name iron_vault

      # 2. ترتيب ملفات C++ و Kotlin
      - name: Setup C++ and Kotlin Files
        run: |
          mkdir -p android/app/src/main/cpp
          if [ -d "cpp" ]; then
            cp -r cpp/* android/app/src/main/cpp/
            rm -rf cpp
          fi
          mkdir -p android/app/src/main/kotlin/com/example/ironvault
          cat > android/app/src/main/kotlin/com/example/ironvault/NativeCore.kt << 'EOF'
          package com.example.ironvault
          object NativeCore {
              init { System.loadLibrary("iron_core") }
              external fun nativeEncrypt(path: String, password: String): String
              external fun nativeWipe(path: String): Boolean
          }
          EOF

      # 3. تعديل build.gradle الرئيسي بأمان باستخدام Python (لإجبار compileSdk 36)
      - name: Safely Patch build.gradle for compileSdk 36
        run: |
          cat << 'PYEOF' > patch_gradle.py
          import os
          import re

          path = 'android/build.gradle'
          if not os.path.exists(path):
              print("File not found, skipping patch.")
              exit(0)

          with open(path, 'r') as f:
              content = f.read()

          # إذا كان الكود موجوداً مسبقاً، لا تفعل شيئاً
          if 'compileSdkVersion = 36' in content:
              print("Patch already applied.")
              exit(0)

          # الكود الذي نريد إضافته
          patch = """
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion = 36
                      }
                  }
              }
          }
          """

          # إدراج الكود في بداية الملف لضمان عدم حدوث أخطاء في بناء الجملة
          new_content = patch + "\n" + content

          with open(path, 'w') as f:
              f.write(new_content)
          print("Patch applied successfully.")
          PYEOF
          python3 patch_gradle.py

      # 4. ربط CMake بـ Gradle
      - name: Link CMake to Gradle
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle.kts; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path = file("src/main/cpp/CMakeLists.txt")\n        }\n    }' android/app/build.gradle.kts
            fi
          elif [ -f "android/app/build.gradle" ]; then
            if ! grep -q "externalNativeBuild" android/app/build.gradle; then
              sed -i '/android {/a \    externalNativeBuild {\n        cmake {\n            path "src/main/cpp/CMakeLists.txt"\n        }\n    }' android/app/build.gradle
            fi
          fi

      - name: Get Dependencies
        run: flutter pub get

      # 5. بناء التطبيق (بدون --init-script)
      - name: Build Standalone Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ironvault-flutter-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
