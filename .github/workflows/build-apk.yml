name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب كود المشروع من مستودع جيت هب
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد بيئة Java اللازمة لبناء تطبيقات أندرويد
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. إعطاء صلاحية التشغيل لأداة البناء Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. تشغيل عملية البناء وتوليد ملف الـ APK بنسخة الـ Debug
    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --stacktrace

    # 5. رفع ملف الـ APK الناتج كملف قابل للتحميل (Artifact)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
